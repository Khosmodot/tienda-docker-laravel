name: tienda
services:
  app:
    build: .
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secreto}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["datos_db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports: ["127.0.0.1:8081:80"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
volumes:
  datos_db:
